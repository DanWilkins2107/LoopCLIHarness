name: Node

on:
  pull_request:
    paths:
      - 'runner/**'
      - 'supervisor/**'
      - 'lambda/spawn/**'
      - 'package.json'
      - 'package-lock.json'
      - '.fallowrc.json'
      - '.github/workflows/node.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [runner, supervisor, lambda/spawn]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run typecheck -w ${{ matrix.package }}

      - run: npm test -w ${{ matrix.package }}

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [runner, supervisor, lambda/spawn]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run lint -w ${{ matrix.package }}

      - run: npm run format:check -w ${{ matrix.package }}

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npx --yes fallow@3.10.0 health --complexity

  mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [runner, supervisor]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run mutation -w ${{ matrix.package }}
